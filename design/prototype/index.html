<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Demanda</title>
  <meta name="color-scheme" content="light dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400..800&family=Source+Serif+4:opsz,wght@8..60,400..700&display=swap">
  <link rel="stylesheet" href="base.css">
  <link rel="stylesheet" href="board.css">
  <link rel="stylesheet" href="panels.css">
  <link rel="stylesheet" href="screens.css">
</head>
<body>
  <main class="login" id="login" data-view data-active="true">
    <section class="login-art" aria-hidden="true">
      <div class="word">
        <svg viewBox="0 0 30 30" width="30" height="30"><rect x="10" y="3" width="10" height="24" rx="3" fill="#35564d"/><rect x="10" y="13" width="10" height="14" rx="3" fill="#4fc2aa"/></svg>
        Demanda
      </div>
      <p>Nada que chega ao escritório fica sem dono.</p>
      <div class="bars" id="bars"></div>
    </section>
    <section class="login-form">
      <form id="login-form">
        <h1>Entrar</h1>
        <label class="field">Empresa
          <input class="input" name="tenant" autocomplete="organization" value="contabilidade-piloto">
        </label>
        <label class="field">E-mail
          <input class="input" type="email" name="email" autocomplete="username" placeholder="voce@empresa.com.br">
        </label>
        <label class="field">Senha
          <input class="input" type="password" name="password" autocomplete="current-password">
        </label>
        <button class="btn btn-primary" type="submit">Entrar</button>
        <p class="hint">Esqueceu a senha? Peça a um sócio para criar outra.</p>
      </form>
    </section>
  </main>

  <div class="app" id="app" data-view data-active="false">
    <nav class="rail" id="rail" aria-label="Principal"></nav>
    <main class="main">
      <div id="board-host"></div>
      <div id="panel-host" hidden></div>
    </main>
  </div>

  <aside class="drawer" id="drawer" role="dialog" aria-modal="false" aria-labelledby="drawer-title" data-open="false"></aside>

  <script type="module">
    import { boot } from "./app.js";
    boot();
  </script>
</body>
</html>
